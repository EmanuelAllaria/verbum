<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbum — Canvas Dinámico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="canvas-container">
        <div id="verse-shell">
            <h1 id="verbum-text" class="style-serif-1">Cargando palabra...</h1>
            <p id="verbum-reference">—</p>
        </div>
    </main>

    <nav id="control-bar" class="controls-collapsed">
        <button
            id="control-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="controls-body"
        >
            <span class="control-toggle-copy">
                <span id="control-toggle-label">Mostrar controles</span>
                <span id="control-toggle-helper">Libro, capítulo y versículos</span>
            </span>
            <span class="control-toggle-icon">+</span>
        </button>

        <div id="controls-body" class="controls-body">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="jesus" type="button">Jesús</button>
                <button class="filter-btn" data-filter="padre" type="button">Padre</button>
                <button class="filter-btn" data-filter="espiritu" type="button">Espíritu Santo</button>
            </div>

            <div class="search-group">
                <div id="book-picker" class="field-shell select-picker">
                    <span class="field-label">Libro</span>
                    <button
                        id="book-trigger"
                        class="multiselect-trigger"
                        type="button"
                        aria-expanded="false"
                        aria-controls="book-menu"
                    >
                        <span id="book-trigger-label" class="multiselect-label">—</span>
                        <span class="multiselect-icon">▼</span>
                    </button>
                    <div id="book-menu" class="verse-menu select-menu">
                        <div class="select-menu-head">
                            <input
                                id="book-search"
                                class="select-search"
                                type="text"
                                placeholder="Buscar libro…"
                                aria-label="Buscar libro"
                            >
                        </div>
                        <div id="book-options" class="select-option-list"></div>
                    </div>
                </div>

                <div id="chapter-picker" class="field-shell select-picker">
                    <span class="field-label">Capítulo</span>
                    <button
                        id="chapter-trigger"
                        class="multiselect-trigger"
                        type="button"
                        aria-expanded="false"
                        aria-controls="chapter-menu"
                    >
                        <span id="chapter-trigger-label" class="multiselect-label">—</span>
                        <span class="multiselect-icon">▼</span>
                    </button>
                    <div id="chapter-menu" class="verse-menu select-menu">
                        <div id="chapter-options" class="chapter-grid"></div>
                    </div>
                </div>

                <div id="verse-picker" class="field-shell verse-picker">
                    <span class="field-label">Versículos</span>
                    <button
                        id="verse-trigger"
                        class="multiselect-trigger"
                        type="button"
                        aria-expanded="false"
                        aria-controls="verse-menu"
                    >
                        <span id="verse-trigger-label" class="multiselect-label">Elegí uno o varios</span>
                        <span class="multiselect-icon">▼</span>
                    </button>

                    <div id="verse-menu" class="verse-menu">
                        <div class="verse-menu-head">
                            <span class="verse-menu-copy">Seleccioná uno o varios versículos</span>
                            <div class="verse-menu-actions">
                                <button type="button" class="verse-inline-action" data-verse-action="select-all">Todos</button>
                                <button type="button" class="verse-inline-action" data-verse-action="clear">Limpiar</button>
                                <button type="button" class="verse-inline-action" data-verse-action="apply">Aceptar</button>
                                <button type="button" class="verse-inline-action" data-verse-action="cancel">Cancelar</button>
                            </div>
                        </div>
                        <div id="verse-options" class="verse-chip-list">
                            <div class="verse-empty">Elegí libro y capítulo</div>
                        </div>
                    </div>
                </div>

                <button id="search-btn" class="secondary-action" type="button">Buscar</button>
            </div>

            <div class="action-group">
                <button id="trigger-btn" class="primary-action" type="button">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                    Inspirame
                </button>
                <button id="copy-btn" class="secondary-action" type="button" disabled>Copiar</button>
                <button id="download-btn" class="secondary-action" type="button" disabled>Descargar</button>
                <button id="share-btn" class="secondary-action" type="button" disabled>Compartir</button>
            </div>
        </div>
    </nav>

    <script src="script.js"></script>
</body>
</html>
