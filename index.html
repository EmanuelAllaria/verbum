<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbum — Canvas Dinámico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-padre: #121210;
            --bg-jesus: #0a0c10;
            --bg-espiritu: #0d0b12;
            --text-primary: #f5f5f7;
            --text-muted: #86868b;
            --border-premium: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.03);
            --blur-effect: blur(16px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-jesus);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            overflow-y: auto;
            padding: clamp(1rem, 2vw, 2rem);
            transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #canvas-container {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: clamp(1rem, 3vw, 2rem);
            position: relative;
            min-height: 0;
            overflow: visible;
        }

        #verse-shell {
            width: min(100%, 980px);
            max-height: min(72vh, 820px);
            overflow-y: auto;
            padding: clamp(1.15rem, 2.4vw, 1.75rem);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.018));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 250ms ease;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        #verse-shell::-webkit-scrollbar {
            width: 10px;
        }

        #verse-shell::-webkit-scrollbar-track {
            background: transparent;
        }

        #verse-shell::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        #verbum-text {
            font-size: clamp(1.8rem, 4vw, 3.5rem);
            line-height: 1.3;
            max-width: 950px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: translateY(0);
            overflow-wrap: anywhere;
        }

        #verbum-reference {
            margin-top: 2rem;
            font-size: clamp(0.9rem, 1.3vw, 1.1rem);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--text-muted);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #control-bar {
            background: var(--card-bg);
            backdrop-filter: var(--blur-effect);
            -webkit-backdrop-filter: var(--blur-effect);
            border: 1px solid var(--border-premium);
            border-radius: 28px;
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.7rem;
            width: min(100%, 1120px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
            transition: all 200ms ease-in-out;
        }

        #control-toggle {
            width: 100%;
            min-height: 56px;
            padding: 0.9rem 1rem;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.065), rgba(255, 255, 255, 0.03)),
                rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            justify-content: space-between;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        #control-toggle:hover {
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04)),
                rgba(255, 255, 255, 0.03);
        }

        .control-toggle-copy {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.18rem;
            text-align: left;
        }

        #control-toggle-label {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        #control-toggle-helper {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.78rem;
            letter-spacing: 0.03em;
        }

        .control-toggle-icon {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            transition: transform 200ms ease-in-out, color 200ms ease-in-out;
        }

        #control-bar.controls-open .control-toggle-icon {
            transform: rotate(45deg);
            color: var(--text-primary);
        }

        .controls-body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1rem 1.1rem;
            max-height: 960px;
            opacity: 1;
            overflow: visible;
            transform: translateY(0);
            transform-origin: top center;
            transition:
                max-height 280ms ease,
                opacity 220ms ease,
                transform 220ms ease,
                padding-top 220ms ease;
        }

        #control-bar.controls-collapsed .controls-body {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding-top: 0;
            pointer-events: none;
            transform: translateY(0.4rem);
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            border-right: 1px solid var(--border-premium);
            padding-right: 2rem;
            flex-wrap: wrap;
        }

        .search-group {
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(120px, 0.7fr) minmax(0, 1.4fr) auto;
            align-items: end;
            gap: 0.65rem;
            padding-right: 1rem;
            border-right: 1px solid var(--border-premium);
            flex: 1 1 680px;
            min-width: min(100%, 680px);
        }

        .field-shell {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            min-width: 0;
        }

        .field-label {
            padding-left: 0.15rem;
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.11em;
        }

        .multiselect-trigger {
            width: 100%;
            min-width: 0;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            padding: 0.82rem 0.95rem;
            border-radius: 16px;
            outline: none;
            font-size: 0.9rem;
            transition: all 200ms ease-in-out;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .multiselect-trigger:focus {
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.065);
            box-shadow:
                0 0 0 4px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .verse-picker {
            position: relative;
        }

        .select-picker {
            position: relative;
        }

        .select-picker.open .multiselect-icon {
            transform: rotate(180deg);
        }

        .multiselect-trigger {
            justify-content: space-between;
            padding-right: 0.85rem;
        }

        .multiselect-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .multiselect-icon {
            color: rgba(255, 255, 255, 0.58);
            transition: transform 200ms ease-in-out;
        }

        .verse-menu {
            position: absolute;
            top: calc(100% + 0.55rem);
            left: 0;
            right: 0;
            z-index: 40;
            padding: 0.8rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background:
                linear-gradient(180deg, rgba(23, 26, 37, 0.98), rgba(12, 13, 22, 0.96)),
                rgba(255, 255, 255, 0.02);
            box-shadow:
                0 18px 38px rgba(0, 0, 0, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            opacity: 0;
            pointer-events: none;
            transform: translateY(0.35rem) scale(0.985);
            transition: all 200ms ease-in-out;
        }

        .verse-picker.open .verse-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .select-picker.open .select-menu {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .select-menu {
            z-index: 45;
        }

        .select-menu-head {
            margin-bottom: 0.75rem;
        }

        .select-search {
            width: 100%;
            min-height: 42px;
            padding: 0.7rem 0.85rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.035);
            color: var(--text-primary);
            outline: none;
            font-size: 0.88rem;
            transition: all 200ms ease-in-out;
        }

        .select-search::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .select-search:focus {
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
        }

        .select-option-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            max-height: 260px;
            overflow: auto;
            scrollbar-width: thin;
        }

        .select-option {
            width: 100%;
            justify-content: space-between;
            text-align: left;
            min-height: 44px;
            padding: 0.7rem 0.9rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.035);
            color: rgba(255, 255, 255, 0.78);
            transition: all 200ms ease-in-out;
        }

        .select-option:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
            transform: translateY(-1px);
        }

        .select-option.active {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .select-option-meta {
            color: rgba(255, 255, 255, 0.48);
            font-size: 0.78rem;
        }

        .chapter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
            gap: 0.45rem;
            max-height: 240px;
            overflow: auto;
            scrollbar-width: thin;
        }

        .chapter-chip {
            min-height: 42px;
            padding: 0.55rem 0.35rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.035);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.88rem;
        }

        .chapter-chip:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
        }

        .chapter-chip.active {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .verse-menu-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            margin-bottom: 0.8rem;
        }

        .verse-menu-copy {
            color: rgba(255, 255, 255, 0.56);
            font-size: 0.78rem;
        }

        .verse-menu-actions {
            display: flex;
            gap: 0.4rem;
            flex-shrink: 0;
        }

        .verse-inline-action {
            min-height: 32px;
            padding: 0.4rem 0.7rem;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.76);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
        }

        .verse-chip-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
            gap: 0.45rem;
            max-height: 220px;
            overflow: auto;
            scrollbar-width: thin;
        }

        .verse-chip {
            min-height: 40px;
            padding: 0.55rem 0.35rem;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.035);
            color: rgba(255, 255, 255, 0.68);
            font-size: 0.82rem;
        }

        .verse-chip:hover {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-primary);
        }

        .verse-chip.active {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .verse-empty {
            display: grid;
            place-items: center;
            min-height: 84px;
            border-radius: 16px;
            border: 1px dashed rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.82rem;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 0.6rem 1.2rem;
            border-radius: 14px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: all 250ms ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            justify-content: center;
            min-height: 44px;
        }

        button:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-1px) scale(1.01);
        }

        button.active {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        button.primary-action {
            background: var(--text-primary);
            color: #000;
            font-weight: 600;
        }

        button.primary-action:hover {
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        button.secondary-action {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.08);
        }

        button.secondary-action:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px) scale(1.01);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .style-serif-1 { font-family: 'Playfair Display', serif; font-style: normal; }
        .style-serif-2 { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }
        .style-classic { font-family: 'Cinzel', serif; letter-spacing: -0.02em; }
        .style-minimal { font-family: 'Inter', sans-serif; font-weight: 300; letter-spacing: -0.03em; }

        @media (max-width: 1024px) {
            #control-bar {
                padding: 0.8rem;
            }

            .filter-group,
            .search-group {
                border-right: none;
                padding-right: 0;
            }

            .search-group {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .search-group #search-btn {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 768px) {
            body {
                min-height: 100dvh;
                justify-content: flex-start;
                gap: 0.85rem;
                padding:
                    max(0.85rem, env(safe-area-inset-top))
                    0.85rem
                    max(1rem, calc(env(safe-area-inset-bottom) + 0.85rem));
            }

            #canvas-container {
                flex: 0 1 auto;
                justify-content: flex-start;
                padding: 0.1rem 0 0.35rem;
            }

            #verse-shell {
                max-height: min(56vh, 540px);
                min-height: clamp(260px, 44vh, 460px);
                border-radius: 24px;
                padding: 1.05rem 1rem 1.1rem;
            }

            #verbum-text {
                font-size: clamp(1.32rem, 6.1vw, 2.15rem);
                line-height: 1.26;
            }

            #verbum-reference {
                margin-top: 1rem;
                font-size: 0.78rem;
                letter-spacing: 0.14em;
            }

            #control-bar {
                position: sticky;
                bottom: max(0.5rem, env(safe-area-inset-bottom));
                gap: 0.7rem;
                border-radius: 26px;
                padding: 0.75rem;
                background:
                    linear-gradient(180deg, rgba(34, 37, 49, 0.84), rgba(13, 15, 24, 0.78)),
                    rgba(255, 255, 255, 0.02);
                box-shadow:
                    0 18px 44px rgba(0, 0, 0, 0.34),
                    inset 0 1px 0 rgba(255, 255, 255, 0.05);
            }

            .filter-group,
            .search-group,
            .action-group {
                width: 100%;
                border-right: none;
                padding-right: 0;
            }

            .filter-group {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 0.5rem;
            }

            .filter-group button {
                width: 100%;
                min-width: 0;
                min-height: 52px;
                padding: 0.7rem 0.5rem;
                border-radius: 17px;
                font-size: 0.76rem;
                line-height: 1.15;
                letter-spacing: 0.02em;
                white-space: normal;
            }

            .search-group {
                grid-template-columns: 1fr;
                gap: 0.55rem;
            }

            .multiselect-trigger {
                min-height: 50px;
                border-radius: 17px;
                font-size: 0.88rem;
            }

            #search-btn {
                width: 100%;
                min-width: 0;
                min-height: 50px;
            }

            .action-group {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 0.5rem;
            }

            #trigger-btn {
                grid-column: 1 / -1;
                min-height: 52px;
            }

            .action-group button {
                width: 100%;
                min-width: 0;
                min-height: 48px;
                padding: 0.72rem 0.6rem;
                font-size: 0.8rem;
                letter-spacing: 0.03em;
            }
        }

        @media (max-width: 540px) {
            #verse-shell {
                min-height: clamp(220px, 40vh, 380px);
            }

            #verbum-text {
                font-size: clamp(1.14rem, 5.9vw, 1.7rem);
            }

            .filter-group button {
                font-size: 0.72rem;
            }

            .verse-menu {
                padding: 0.75rem;
            }

            .verse-menu-head {
                flex-direction: column;
                align-items: flex-start;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <main id="canvas-container">
        <div id="verse-shell">
            <h1 id="verbum-text" class="style-serif-1">Cargando palabra...</h1>
            <p id="verbum-reference">—</p>
        </div>
    </main>

    <nav id="control-bar" class="controls-collapsed">
        <button
            id="control-toggle"
            type="button"
            onclick="toggleControlsPanel()"
            aria-expanded="false"
            aria-controls="controls-body"
        >
            <span class="control-toggle-copy">
                <span id="control-toggle-label">Mostrar controles</span>
                <span id="control-toggle-helper">Libro, capítulo y versículos</span>
            </span>
            <span class="control-toggle-icon">+</span>
        </button>

        <div id="controls-body" class="controls-body">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="jesus" onclick="setFilter('jesus')">Jesús</button>
                <button class="filter-btn" data-filter="padre" onclick="setFilter('padre')">Padre</button>
                <button class="filter-btn" data-filter="espiritu" onclick="setFilter('espiritu')">Espíritu Santo</button>
            </div>

            <div class="search-group">
                <div id="book-picker" class="field-shell select-picker">
                    <span class="field-label">Libro</span>
                    <button
                        id="book-trigger"
                        class="multiselect-trigger"
                        type="button"
                        onclick="toggleBookMenu()"
                        aria-expanded="false"
                        aria-controls="book-menu"
                    >
                        <span id="book-trigger-label" class="multiselect-label">—</span>
                        <span class="multiselect-icon">▼</span>
                    </button>
                    <div id="book-menu" class="verse-menu select-menu">
                        <div class="select-menu-head">
                            <input
                                id="book-search"
                                class="select-search"
                                type="text"
                                placeholder="Buscar libro…"
                                aria-label="Buscar libro"
                                oninput="filterBookOptions()"
                            />
                        </div>
                        <div id="book-options" class="select-option-list"></div>
                    </div>
                </div>

                <div id="chapter-picker" class="field-shell select-picker">
                    <span class="field-label">Capítulo</span>
                    <button
                        id="chapter-trigger"
                        class="multiselect-trigger"
                        type="button"
                        onclick="toggleChapterMenu()"
                        aria-expanded="false"
                        aria-controls="chapter-menu"
                    >
                        <span id="chapter-trigger-label" class="multiselect-label">—</span>
                        <span class="multiselect-icon">▼</span>
                    </button>
                    <div id="chapter-menu" class="verse-menu select-menu">
                        <div id="chapter-options" class="chapter-grid"></div>
                    </div>
                </div>

                <div id="verse-picker" class="field-shell verse-picker">
                    <span class="field-label">Versículos</span>
                    <button
                        id="verse-trigger"
                        class="multiselect-trigger"
                        type="button"
                        onclick="toggleVerseMenu()"
                        aria-expanded="false"
                        aria-controls="verse-menu"
                    >
                        <span id="verse-trigger-label" class="multiselect-label">Elegí uno o varios</span>
                        <span class="multiselect-icon">▼</span>
                    </button>

                    <div id="verse-menu" class="verse-menu">
                        <div class="verse-menu-head">
                            <span class="verse-menu-copy">Seleccioná uno o varios versículos</span>
                            <div class="verse-menu-actions">
                                <button type="button" class="verse-inline-action" onclick="selectAllVerses()">Todos</button>
                                <button type="button" class="verse-inline-action" onclick="clearVerseSelection()">Limpiar</button>
                                <button type="button" class="verse-inline-action" onclick="applyVerseSelection()">Aceptar</button>

        function formatVerseSelectionReference(verses) {
            const sorted = [...new Set(verses)].sort((a, b) => a - b);
            if (!sorted.length) return '';
            const parts = [];
            let rangeStart = sorted[0];
            let previous = sorted[0];

            for (let index = 1; index <= sorted.length; index += 1) {
                const current = sorted[index];
                if (current === previous + 1) {
                    previous = current;
                    continue;
                }
                parts.push(rangeStart === previous ? `${rangeStart}` : `${rangeStart}-${previous}`);
                rangeStart = current;
                previous = current;
            }

            return parts.join(',');
        }

        async function fetchChapterVerses(bookSlug, chapter) {
            const cached = getCachedChapterVerses(bookSlug, chapter);
            if (cached) return cached;

            const response = await fetch(`${API_BASE}/${bookSlug}/${chapter}`);
            if (!response.ok) throw new Error('No se pudo cargar el capítulo');

            const data = await response.json();
            const verses = data?.data?.verses;
            if (!Array.isArray(verses) || verses.length === 0) {
                throw new Error('Capítulo vacío');
            }

            cacheChapterVerses(bookSlug, chapter, verses);
            return getCachedChapterVerses(bookSlug, chapter) || [];
        }

            return { bookSlug: selectedBookSlug, chapter: selectedChapter };

        async function loadVerseOptions({ preserveSelection = true, preselectedVerses = null } = {}) {
            const { bookSlug, chapter } = getCurrentSelectionContext();
            const container = document.getElementById('verse-options');
            const trigger = document.getElementById('verse-trigger');
            if (!bookSlug || !chapter || !container || !trigger) return [];

            container.innerHTML = '<div class="verse-empty">Cargando versículos...</div>';
            trigger.disabled = true;

            try {
                const verses = await fetchChapterVerses(bookSlug, chapter);
                const nextSelection = Array.isArray(preselectedVerses)
                    ? preselectedVerses
                    : preserveSelection
                        ? selectedVerses
                        : [];

                selectedVerses = [...new Set(nextSelection)]
                    .filter(verse => verse >= 1 && verse <= verses.length)
                    .sort((a, b) => a - b);
                pendingVerses = null;

                renderVerseOptions(verses, selectedVerses);
                updateVerseTriggerLabel();
                return verses;
            } catch (error) {
                selectedVerses = [];
                pendingVerses = null;
                updateVerseTriggerLabel();
                container.innerHTML = '<div class="verse-empty">No se pudieron cargar los versículos</div>';
                return [];
            } finally {
                trigger.disabled = false;
            }
        }

            ['ap', 'revelation'], ['apo', 'revelation']
        ].forEach(([alias, slug]) => registerBookAlias(alias, slug));

        function setExportButtonsDisabled(disabled) {
            ['copy-btn', 'download-btn', 'share-btn'].forEach(id => {
                const element = document.getElementById(id);
                if (element) element.disabled = disabled;
            });
        }

        function setBusyState(isBusy) {
            const triggerBtn = document.getElementById('trigger-btn');
            const searchBtn = document.getElementById('search-btn');
            const controlToggle = document.getElementById('control-toggle');
            const bookTrigger = document.getElementById('book-trigger');
            const chapterTrigger = document.getElementById('chapter-trigger');
            const verseTrigger = document.getElementById('verse-trigger');
            if (triggerBtn) triggerBtn.disabled = isBusy;
            if (searchBtn) searchBtn.disabled = isBusy;
            if (controlToggle) controlToggle.disabled = isBusy;
            if (bookTrigger) bookTrigger.disabled = isBusy;
            if (chapterTrigger) chapterTrigger.disabled = isBusy;
            if (verseTrigger) verseTrigger.disabled = isBusy;
            document.querySelectorAll('.filter-btn, .verse-inline-action, .verse-chip, .select-option, .chapter-chip').forEach(element => {
                element.disabled = isBusy;
            });
            if (isBusy) closeVerseMenu();
            if (isBusy) setExportButtonsDisabled(true);
        }

        function setActiveFilterUI(filter) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-filter="${filter}"]`).classList.add('active');
            document.body.style.backgroundColor = `var(--bg-${filter})`;
            syncControlToggleCopy();
        }

        function pulseActionLabel(button, label, fallbackLabel, duration = 1400) {
            if (!button) return;
            const original = fallbackLabel || button.dataset.originalLabel || button.textContent;
            button.dataset.originalLabel = original;
            button.textContent = label;
            window.clearTimeout(button._labelTimer);
            button._labelTimer = window.setTimeout(() => {
                button.textContent = original;
            }, duration);
        }

        function sanitizeFilePart(value) {
            return String(value || '')
                .toLowerCase()
                .replace(/[^\w\-]+/g, '-')
                .replace(/-+/g, '-')
                .replace(/^-|-$/g, '');
        }

        async function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight) {
            const paragraphs = String(text || '').split('\n');
            const lines = [];

            paragraphs.forEach(paragraph => {
                const words = paragraph.split(/\s+/).filter(Boolean);
                if (!words.length) {
                    lines.push('');
                    return;
                }

                let line = words[0];
                for (let i = 1; i < words.length; i += 1) {
                    const testLine = `${line} ${words[i]}`;
                    if (ctx.measureText(testLine).width <= maxWidth) {
                        line = testLine;
                    } else {
                        lines.push(line);
                        line = words[i];
                    }
                }
                lines.push(line);
            });

            lines.forEach((line, index) => {
                ctx.fillText(line, x, y + index * lineHeight);
            });

            return lines;
        }

        async function buildShareCanvas() {
            if (!currentDisplay) throw new Error('No hay contenido para exportar');
            if (document.fonts?.ready) {
                try { await document.fonts.ready; } catch {}
            }

            const canvas = document.createElement('canvas');
            canvas.width = 1200;
            canvas.height = 1500;
            const ctx = canvas.getContext('2d');
            const theme = filterThemeStyles[currentDisplay.filter] || filterThemeStyles.jesus;
            const [bgA, bgB, bgC] = theme.background;

            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, bgA);
            gradient.addColorStop(0.55, bgB);
            gradient.addColorStop(1, bgC);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const orb = ctx.createRadialGradient(260, 220, 0, 260, 220, 420);
            orb.addColorStop(0, theme.glow);
            orb.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = orb;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const panelX = 90;
            const panelY = 90;
            const panelWidth = canvas.width - 180;
            const panelHeight = canvas.height - 180;
            const radius = 42;

            ctx.beginPath();
            ctx.moveTo(panelX + radius, panelY);
            ctx.lineTo(panelX + panelWidth - radius, panelY);
            ctx.quadraticCurveTo(panelX + panelWidth, panelY, panelX + panelWidth, panelY + radius);
            ctx.lineTo(panelX + panelWidth, panelY + panelHeight - radius);
            ctx.quadraticCurveTo(panelX + panelWidth, panelY + panelHeight, panelX + panelWidth - radius, panelY + panelHeight);
            ctx.lineTo(panelX + radius, panelY + panelHeight);
            ctx.quadraticCurveTo(panelX, panelY + panelHeight, panelX, panelY + panelHeight - radius);
            ctx.lineTo(panelX, panelY + radius);
            ctx.quadraticCurveTo(panelX, panelY, panelX + radius, panelY);
            ctx.closePath();
            ctx.fillStyle = 'rgba(255,255,255,0.055)';
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.fillStyle = 'rgba(255,255,255,0.68)';
            ctx.font = '500 28px Inter, system-ui, sans-serif';
            ctx.fillText(filterLabels[currentDisplay.filter] || 'Inspiración', panelX + 52, panelY + 70);

            ctx.fillStyle = theme.accent;
            const fontMap = {
                'style-serif-1': '600 "{FONT}", "Playfair Display", serif',
                'style-serif-2': '400 italic "{FONT}", "Instrument Serif", serif',
                'style-classic': '600 "{FONT}", "Cinzel", serif',
                'style-minimal': '300 "{FONT}", Inter, sans-serif'
            };
            const familyToken = currentDisplay.styleClass === 'style-serif-2'
                ? '72px'
                : currentDisplay.styleClass === 'style-classic'
                    ? '68px'
                    : currentDisplay.styleClass === 'style-minimal'
                        ? '62px'
                        : '70px';

            let textSize = parseInt(familyToken, 10);
            let lineHeight = textSize * 1.34;
            const maxTextWidth = panelWidth - 120;
            const maxTextHeight = 780;
            let lines = [];

            while (textSize >= 38) {
                const fontTemplate = fontMap[currentDisplay.styleClass] || fontMap['style-serif-1'];
                ctx.font = fontTemplate.replace('{FONT}', `${textSize}px`);
                lineHeight = textSize * 1.34;

                const words = currentDisplay.text.split(/\s+/).filter(Boolean);
                lines = [];
                let line = words[0] || '';
                for (let i = 1; i < words.length; i += 1) {
                    const testLine = `${line} ${words[i]}`;
                    if (ctx.measureText(testLine).width <= maxTextWidth) {
                        line = testLine;
                    } else {
                        lines.push(line);
                        line = words[i];
                    }
                }
                if (line) lines.push(line);

                if (lines.length * lineHeight <= maxTextHeight) break;
                textSize -= 4;
            }

            const blockHeight = lines.length * lineHeight;
            let textY = panelY + 220 + Math.max(0, (maxTextHeight - blockHeight) / 2);
            ctx.textAlign = currentDisplay.align;
            const textX = currentDisplay.align === 'left'
                ? panelX + 60
                : currentDisplay.align === 'right'
                    ? panelX + panelWidth - 60
                    : panelX + panelWidth / 2;

            lines.forEach((line, index) => {
                ctx.fillText(line, textX, textY + index * lineHeight);
            });

            ctx.textAlign = 'left';
            ctx.fillStyle = 'rgba(255,255,255,0.62)';
            ctx.font = '500 26px Inter, system-ui, sans-serif';
            ctx.fillText(currentDisplay.reference, panelX + 52, panelY + panelHeight - 84);

            ctx.textAlign = 'right';
            ctx.fillStyle = 'rgba(255,255,255,0.42)';
            ctx.font = '500 22px Inter, system-ui, sans-serif';
            ctx.fillText('Verbum', panelX + panelWidth - 52, panelY + panelHeight - 84);

            return canvas;
        }

        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) resolve(blob);
                    else reject(new Error('No se pudo generar la imagen'));
                }, 'image/png');
            });
        }

        async function copyCurrentImage() {
            const button = document.getElementById('copy-btn');
            try {
                if (!navigator.clipboard || typeof ClipboardItem === 'undefined') {
                    throw new Error('Clipboard no soportado');
                }
                const canvas = await buildShareCanvas();
                const blob = await canvasToBlob(canvas);
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
                pulseActionLabel(button, 'Copiado', 'Copiar');
            } catch (error) {
                pulseActionLabel(button, 'No se pudo', 'Copiar');
            }
        }

        async function downloadCurrentImage() {
            const button = document.getElementById('download-btn');
            try {
                const canvas = await buildShareCanvas();
                const blob = await canvasToBlob(canvas);
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                const filterPart = sanitizeFilePart(filterLabels[currentDisplay?.filter] || 'verbum');
                const refPart = sanitizeFilePart(currentDisplay?.reference || 'pasaje');
                link.href = url;
                link.download = `verbum-${filterPart}-${refPart}.png`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
                pulseActionLabel(button, 'Descargado', 'Descargar');
            } catch (error) {
                pulseActionLabel(button, 'No se pudo', 'Descargar');
            }
        }

        async function shareCurrentImage() {
            const button = document.getElementById('share-btn');
            try {
                const canvas = await buildShareCanvas();
                const blob = await canvasToBlob(canvas);
                const file = new File([blob], 'verbum.png', { type: 'image/png' });

                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'Verbum',
                        text: currentDisplay?.reference || 'Pasaje bíblico'
                    });
                    pulseActionLabel(button, 'Compartido', 'Compartir');
                    return;
                }

                await downloadCurrentImage();
                pulseActionLabel(button, 'Descargado', 'Compartir');
            } catch (error) {
                pulseActionLabel(button, 'No se pudo', 'Compartir');
            }
        }

        function bookNameFromSlug(slug) {
            return BIBLE_BOOKS.find(book => book.slug === slug)?.name || slug;
        }

        function parseReferenceInput(reference) {
            const raw = String(reference || '').trim();
            const match = raw.match(/^(.*?)\s+(\d+)\s*:\s*(\d+)(?:\s*-\s*(\d+))?$/i);
            if (!match) return null;

            const bookPart = normalizeText(match[1]).replace(/\./g, '').trim();
            const chapter = Number(match[2]);
            const verseStart = Number(match[3]);
            const verseEnd = match[4] ? Number(match[4]) : verseStart;
            const slug = BOOK_LOOKUP.get(bookPart);

            if (!slug || !chapter || !verseStart || !verseEnd || verseEnd < verseStart) {
                return null;
            }

            return {
                slug,
                chapter,
                verseStart,
                verseEnd,
                raw
            };
        }

        function applyDisplayResult(result) {
            const textElement = document.getElementById('verbum-text');
            const refElement = document.getElementById('verbum-reference');

            textElement.innerText = `"${result.text}"`;
            adjustVerseLayout(result.text);
            refElement.innerText = result.reference;

            textElement.className = '';
            const chosenFont = result.styleClass || randomFrom(fonts);
            textElement.classList.add(chosenFont);

            const chosenAlign = result.align || randomFrom(alignments);
            document.getElementById('canvas-container').style.alignItems =
                chosenAlign === 'left' ? 'flex-start' : chosenAlign === 'right' ? 'flex-end' : 'center';
            textElement.style.textAlign = chosenAlign;
            textElement.style.textShadow = result.filter === 'espiritu' ? '0 0 40px rgba(147, 51, 234, 0.15)' : 'none';

            currentDisplay = {
                text: result.text,
                reference: result.reference,
                filter: result.filter,
                styleClass: chosenFont,
                align: chosenAlign
            };

            textElement.style.opacity = '1';
            textElement.style.transform = 'translateY(0)';
            refElement.style.opacity = '1';
            setExportButtonsDisabled(false);
        }

        function showMessageState(message, referenceText) {
            const textElement = document.getElementById('verbum-text');
            const refElement = document.getElementById('verbum-reference');
            textElement.innerText = message;
            adjustVerseLayout(textElement.innerText);
            refElement.innerText = referenceText;
            currentDisplay = null;
            textElement.style.opacity = '1';
            textElement.style.transform = 'translateY(0)';
            refElement.style.opacity = '1';
            setExportButtonsDisabled(true);
        }

        function scorePassage(text, profile) {
            const normalized = normalizeText(text);
            let score = 0;
            let matches = 0;

            profile.anchors.forEach(keyword => {
                if (normalized.includes(keyword)) {
                    score += 10;
                    matches += 1;
                }
            });

            profile.traits.forEach(keyword => {
                if (normalized.includes(keyword)) {
                    score += 4;
                    matches += 1;
                }
            });

            profile.phrases.forEach(keyword => {
                if (normalized.includes(keyword)) {
                    score += 7;
                    matches += 1;
                }
            });

            (profile.negatives || []).forEach(keyword => {
                if (normalized.includes(keyword)) {
                    score -= 10;
                }
            });

            const wordCount = normalized.split(/\s+/).filter(Boolean).length;
            if (wordCount < 7) score -= 2;
            score -= Math.max(0, wordCount - 90) * 0.03;

            return matches > 0 ? score : 0;
        }

        function findBestPassageInChapter(verses, profile) {
            let best = null;

            for (let start = 0; start < verses.length; start += 1) {
                const maxLength = Math.min(5, verses.length - start);

                for (let length = 1; length <= maxLength; length += 1) {
                    const slice = verses.slice(start, start + length).map(verse => verse.trim()).filter(Boolean);
                    if (!slice.length) continue;

                    const passageText = slice.join(' ');
                    const score = scorePassage(passageText, profile);
                    if (score <= 0) continue;

                    const candidate = {
                        score,
                        startVerse: start + 1,
                        endVerse: start + length,
                        text: passageText,
                        length
                    };

                    if (
                        !best ||
                        candidate.score > best.score ||
                        (candidate.score === best.score && candidate.length < best.length)
                    ) {
                        best = candidate;
                    }
                }
            }

            return best;
        }

        function setFilter(filter) {
            setActiveFilterUI(filter);
            fetchBibleVersicle();
        }

        function inspireAny() {
            const randomFilter = randomFrom(filterOptions);
            setActiveFilterUI(randomFilter);
            fetchBibleVersicle(randomFilter);
        }

        async function searchReference() {
            const textElement = document.getElementById('verbum-text');
            const refElement = document.getElementById('verbum-reference');
            const { bookSlug, chapter } = getCurrentSelectionContext();
            const verseReference = formatVerseSelectionReference(selectedVerses);

            if (!bookSlug || !chapter || !selectedVerses.length) {
                showMessageState('Seleccioná uno o más versículos.', 'Elegí libro, capítulo y uno o varios versículos');
                return;
            }

            setBusyState(true);
            textElement.style.opacity = '0';
            textElement.style.transform = 'translateY(10px)';
            refElement.style.opacity = '0';

            try {
                const verses = await fetchChapterVerses(bookSlug, chapter);
                const cleanText = selectedVerses
                    .map(verseNumber => verses[verseNumber - 1])
                    .filter(Boolean)
                    .join(' ');
                if (!cleanText) throw new Error('Pasaje vacío');

                const display = {
                    text: cleanText,
                    reference: `${bookNameFromSlug(bookSlug)} ${chapter}:${verseReference}`,
                    filter: currentFilter
                };

                setTimeout(() => {
                    applyDisplayResult(display);
                    closeVerseMenu();
                    if (compactViewport) setControlsPanelOpen(false);
                    setBusyState(false);
                }, 220);
            } catch (error) {
                setTimeout(() => {
                    showMessageState('No se encontró ese pasaje.', 'Probá con otra selección dentro del capítulo');
                    setBusyState(false);
                }, 220);
            }
        }

        async function fetchBibleVersicle(filterOverride = currentFilter) {
            const textElement = document.getElementById('verbum-text');
            const refElement = document.getElementById('verbum-reference');
            const profile = themeProfiles[filterOverride];
            
            setBusyState(true);
            textElement.style.opacity = '0';
            textElement.style.transform = 'translateY(10px)';
            refElement.style.opacity = '0';

            try {
                let bestMatch = null;

                for (let attempt = 0; attempt < 12; attempt += 1) {
                    const randomBook = randomFrom(BIBLE_BOOKS);
                    const randomChapter = Math.floor(Math.random() * randomBook.chapters) + 1;
                    const response = await fetch(`${API_BASE}/${randomBook.slug}/${randomChapter}`);
                    if (!response.ok) continue;

                    const data = await response.json();
                    const verses = data?.data?.verses;
                    if (!Array.isArray(verses) || verses.length === 0) continue;
                    cacheChapterVerses(randomBook.slug, randomChapter, verses);

                    const candidate = findBestPassageInChapter(verses, profile);
                    if (!candidate) continue;

                    bestMatch = {
                        ...candidate,
                        book: randomBook,
                        chapter: randomChapter,
                        filter: filterOverride
                    };

                    if (candidate.score >= profile.targetScore) break;
                }

                if (!bestMatch || !bestMatch.text) {
                    throw new Error('No se encontró un pasaje temático');
                }
                
                setTimeout(() => {
                    const reference =
                        bestMatch.startVerse === bestMatch.endVerse
                            ? `${bestMatch.book.name} ${bestMatch.chapter}:${bestMatch.startVerse}`
                            : `${bestMatch.book.name} ${bestMatch.chapter}:${bestMatch.startVerse}-${bestMatch.endVerse}`;
                    const matchedVerses = buildVerseRange(bestMatch.startVerse, bestMatch.endVerse);
                    applyDisplayResult({
                        text: bestMatch.text,
                        reference,
                        filter: filterOverride,
                        styleClass: randomFrom(fonts),
                        align: randomFrom(alignments)
                    });
                    syncSearchControlsToPassage(bestMatch.book.slug, bestMatch.chapter, matchedVerses).catch(() => {});
                    closeVerseMenu();
                    if (compactViewport) setControlsPanelOpen(false);
                    setBusyState(false);
                }, 300);

            } catch (error) {
                setTimeout(() => {
                    showMessageState('No se pudo cargar un versículo ahora.', 'Verificá tu conexión o la disponibilidad de la API');
                    setBusyState(false);
                }, 300);
            }
        }

        window.onload = async () => {
            setActiveFilterUI(currentFilter);
            syncControlsLayout(true);
            selectedBookSlug = 'john';
            selectedChapter = 3;
            syncBookTriggerLabel();
            syncChapterTriggerLabel();
            renderBookOptions('');
            renderChapterOptions();
            await loadVerseOptions({ preserveSelection: false, preselectedVerses: [16] });
            fetchBibleVersicle();
            document.addEventListener('click', (event) => {
                const path = typeof event.composedPath === 'function' ? event.composedPath() : [];
                const versePicker = document.getElementById('verse-picker');
                const bookPicker = document.getElementById('book-picker');
                const chapterPicker = document.getElementById('chapter-picker');
                if (versePicker && !(path.includes(versePicker) || versePicker.contains(event.target))) closeVerseMenu();
                if (bookPicker && !(path.includes(bookPicker) || bookPicker.contains(event.target))) closeBookMenu();
                if (chapterPicker && !(path.includes(chapterPicker) || chapterPicker.contains(event.target))) closeChapterMenu();
            });
            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    closeVerseMenu();
                    closeBookMenu();
                    closeChapterMenu();
                }
            });
            window.addEventListener('resize', () => {
                syncControlsLayout();
            });
        };
